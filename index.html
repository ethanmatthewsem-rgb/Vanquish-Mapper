<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Vanquish Mapper v4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}body{overflow:hidden;font-family:-apple-system,sans-serif;background:#111}#map{position:fixed;inset:0}.hud{position:fixed;z-index:1000;left:10px;right:10px;color:#fff}.top{top:max(10px,env(safe-area-inset-top));display:flex;gap:6px}.bottom{bottom:max(10px,env(safe-area-inset-bottom))}.p,.panel,button{background:rgba(10,13,17,.72);backdrop-filter:blur(12px);border:1px solid #ffffff33;color:#fff;border-radius:14px}.p{padding:7px 10px;font-size:11px}.grow{flex:1}.panel{padding:8px}.vals{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.v{font-size:18px;font-weight:800}.l{font-size:8px;color:#bbc3cd}.actions{display:flex;gap:5px;margin-top:7px}button{padding:10px 7px;font-weight:700;flex:1}.on{outline:2px solid #45aaff}.layers{display:none;margin-bottom:6px}.layers.show{display:block}.row{display:flex;gap:7px;align-items:center;font-size:11px;margin:6px}.row input[type=range]{flex:1}.tones{display:flex;gap:4px}.tones button{font-size:10px;padding:7px 2px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;margin-right:5px}.dot.live{background:#35e36c}.leaflet-control-attribution{font-size:8px!important}
</style></head><body><div id="map"></div>
<div class="hud top"><div class="p"><b>VANQUISH v4</b></div><div class="p grow"><span id="dot" class="dot"></span><span id="state">READY</span></div><div class="p">GPS <b id="acc">--</b>m</div></div>
<div class="hud bottom"><div id="layersBox" class="panel layers"><div class="tones"><button class="on" data-t="ALL">Overall</button><button data-t="LOW">Low</button><button data-t="MID">Mid</button><button data-t="HIGH">High</button></div><div class="row">Opacity<input id="op" type="range" min="10" max="100" value="58"></div><div class="row">Radius<input id="rad" type="range" min="10" max="55" value="28"></div><div class="row">Threshold<input id="thr" type="range" min="5" max="25" value="10"></div></div>
<div class="panel"><div class="vals"><div><div class="v" id="hz">--</div><div class="l">HZ</div></div><div><div class="v" id="db">--</div><div class="l">DB</div></div><div><div class="v" id="score">0</div><div class="l">SCORE</div></div><div><div class="v" id="tone">--</div><div class="l">TONE</div></div></div>
<div class="actions"><button id="start">Start</button><button id="follow" class="on">◎ Follow</button><button id="layers">Layers</button><button id="csv">CSV</button></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script><script>
const $=x=>document.getElementById(x),map=L.map('map',{zoomControl:false}).setView([35.5,-95.4],19);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'}).addTo(map);
let heat=L.heatLayer([],{radius:28,blur:23,minOpacity:.12,gradient:{.15:'#244cff',.35:'#00d5ff',.55:'#00db63',.75:'#ffe600',1:'#ff2b1a'}}).addTo(map),track=L.polyline([],{weight:3,opacity:.65}).addTo(map);
let run=false,follow=true,pos=null,prev=null,heading=0,ctx,an,stream,watch,rows=[],hits=[],noise=-50,cal=false,cals=[],last=0,lastHit=0,filter='ALL';const FFT=4096;
function distance(a,b){let R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){let p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,d=(b.lon-a.lon)*Math.PI/180;return(Math.atan2(Math.sin(d)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(d))*180/Math.PI+360)%360}
function smooth(a,b,k=.3){let d=((b-a+540)%360)-180;return(a+d*k+360)%360}
function gps(){watch=navigator.geolocation.watchPosition(p=>{let n={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};$('acc').textContent=n.acc.toFixed(1);if(prev&&distance(prev,n)>.8)heading=smooth(heading,bearing(prev,n));prev=n;pos=n;track.addLatLng([n.lat,n.lon]);if(follow)map.panTo([n.lat,n.lon],{animate:false})},e=>{$('state').textContent='GPS ERROR'},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function med(a){let b=[...a].sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:-50}function rms(a){let s=0;for(let v of a){let x=(v-128)/128;s+=x*x}return 20*Math.log10(Math.sqrt(s/a.length)||1e-8)}
function pk(f,sr){let bw=sr/FFT,lo=Math.ceil(180/bw),hi=Math.min(f.length-1,Math.floor(4200/bw)),m=-1,ix=lo,sum=0,n=0;for(let i=lo;i<=hi;i++){sum+=f[i];n++;if(f[i]>m){m=f[i];ix=i}}return{hz:ix*bw,p:m-sum/n}}
function tone(h){return h<400?'LOW':h<750?'MID':'HIGH'}function score(d,h,p){let o=d-noise,t=+$('thr').value;if(o<t||p<12)return 0;return Math.round(100*(.72*Math.min(1,(o-t)/20)+.28*Math.min(1,(p-12)/55)))}
function redraw(){let a=hits.filter(x=>filter==='ALL'||x.tone===filter).map(x=>[x.lat,x.lon,x.score/100]);heat.setLatLngs(a);heat.setOptions({radius:+$('rad').value,blur:+$('rad').value*.82});heat.getPane().style.opacity=+$('op').value/100}
async function start(){if(run){stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext();await ctx.resume();an=ctx.createAnalyser();an.fftSize=FFT;ctx.createMediaStreamSource(stream).connect(an);run=true;rows=[];hits=[];cals=[];cal=true;$('start').textContent='Stop';$('dot').classList.add('live');$('state').textContent='CALIBRATING';setTimeout(()=>{noise=med(cals);cal=false;$('state').textContent='SCANNING'},2000);gps();requestAnimationFrame(loop)}catch(e){$('state').textContent='START ERROR'}}
function stop(){run=false;if(watch!=null)navigator.geolocation.clearWatch(watch);if(stream)stream.getTracks().forEach(x=>x.stop());if(ctx)ctx.close();$('start').textContent='Start';$('dot').classList.remove('live');$('state').textContent='READY'}
function loop(t){if(!run)return;if(t-last>100){last=t;let td=new Uint8Array(an.fftSize),fd=new Uint8Array(an.frequencyBinCount);an.getByteTimeDomainData(td);an.getByteFrequencyData(fd);let d=rms(td),p=pk(fd,ctx.sampleRate);if(cal)cals.push(d);let s=cal?0:score(d,p.hz,p.p);if(!cal&&s===0)noise=noise*.985+d*.015;let tc=tone(p.hz);$('hz').textContent=Math.round(p.hz);$('db').textContent=d.toFixed(0);$('score').textContent=s;$('tone').textContent=tc;let r={time:new Date().toISOString(),lat:pos?.lat??'',lon:pos?.lon??'',accuracy:pos?.acc??'',db:d,noise,hz:p.hz,prom:p.p,score:s,tone:tc,heading};rows.push(r);if(s>=15&&pos&&t-lastHit>180){hits.push({...r});lastHit=t;redraw()}}requestAnimationFrame(loop)}
function csv(){let a=['time,latitude,longitude,gps_accuracy_m,audio_db,noise_floor_db,db_above_noise,dominant_hz,spectral_prominence,target_score,tone_class,walking_heading_deg'];rows.forEach(r=>a.push([r.time,r.lat,r.lon,r.accuracy,r.db.toFixed(3),r.noise.toFixed(3),(r.db-r.noise).toFixed(3),r.hz.toFixed(3),r.prom.toFixed(2),r.score,r.tone,r.heading.toFixed(1)].join(',')));let u=URL.createObjectURL(new Blob([a.join('\n')],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download='vanquish_v4.csv';x.click()}
$('start').onclick=start;$('csv').onclick=csv;$('layers').onclick=()=>$('layersBox').classList.toggle('show');$('follow').onclick=()=>{follow=!follow;$('follow').classList.toggle('on',follow);if(follow&&pos)map.setView([pos.lat,pos.lon],19)};map.on('dragstart',()=>{follow=false;$('follow').classList.remove('on')});$('op').oninput=redraw;$('rad').oninput=redraw;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.t;redraw()});
</script></body></html>
